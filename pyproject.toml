[project]
name = "py-agent-harness"
version = "0.1.0"
description = "Playing around with agentic harnesses"
readme = "README.md"
authors = [
    { name = "kartikadur", email = "kartikadur@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.46.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
py-agent-harness = "py_agent_harness:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
